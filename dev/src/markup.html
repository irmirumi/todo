<div class="wrap">
  <header class="top">
    <div class="seg" role="group" aria-label="보기">
      <button id="vDay" type="button" data-act="view" data-v="day">하루</button>
      <button id="vWeek" type="button" data-act="view" data-v="week">시간표</button>
      <button id="vAll" type="button" data-act="view" data-v="all">전체</button>
    </div>
    <button class="more" type="button" data-act="menu" aria-label="더보기"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="1.6" fill="currentColor"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><circle cx="14" cy="9" r="1.6" fill="currentColor"/></svg></button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="layout">
    <aside class="cal" id="cal" aria-label="달력"></aside>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><div class="sheet" id="sheet" tabindex="-1" autofocus></div></dialog>
<div id="toast" class="toast" role="status" popover="manual" hidden><span id="toastMsg"></span><button id="toastAct" type="button" hidden></button></div>
