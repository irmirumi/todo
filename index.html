<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>할 일 수첩</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10131A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>할 일 수첩</div>
    <div class="seg" role="group" aria-label="보기">
      <button id="vDay" type="button" data-act="view" data-v="day">날짜별</button>
      <button id="vAll" type="button" data-act="view" data-v="all">전체 목록</button>
    </div>
    <button class="more" type="button" data-act="menu" aria-label="더보기"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="1.6" fill="currentColor"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><circle cx="14" cy="9" r="1.6" fill="currentColor"/></svg></button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="layout">
    <aside class="cal" id="cal" aria-label="달력"></aside>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="ui.js"></script>
<script type="module" src="app.js"></script>
</body>
