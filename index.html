<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>또박</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="또박">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/WantedSansVariable.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="seg" role="group" aria-label="보기">
      <button id="vDay" type="button" data-act="view" data-v="day">달력</button>
      <button id="vWeek" type="button" data-act="view" data-v="week">시간표</button>
      <button id="vAll" type="button" data-act="view" data-v="all">전체</button>
    </div>
    <button class="more" type="button" data-act="menu" aria-label="더보기"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="1.6" fill="currentColor"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><circle cx="14" cy="9" r="1.6" fill="currentColor"/></svg></button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="layout">
    <aside class="cal" id="cal" aria-label="달력"></aside>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><div class="sheet" id="sheet" tabindex="-1" autofocus></div></dialog>
<div id="toast" class="toast" role="status" popover="manual" hidden><span id="toastMsg"></span><button id="toastAct" type="button" hidden></button></div>
<script src="vendor/morphdom.min.js"></script>
<script src="holidays.js"></script>
<script src="ui.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
